name: player-unity
# Проверка плеера в настоящем Unity без очков: EditMode + PlayMode тесты в симуляторе,
# скриншоты каждого шага в артефакте "player-screenshots".
# Нужны секреты репозитория UNITY_LICENSE (содержимое Unity_lic.ulf), UNITY_EMAIL, UNITY_PASSWORD.
on:
  workflow_dispatch:
  push:
    paths: ["player/**", "samples/**", ".github/workflows/player-unity.yml"]
  pull_request:
    paths: ["player/**", "samples/**", ".github/workflows/player-unity.yml"]
jobs:
  unity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Секреты Unity заданы?
        if: env.UNITY_LICENSE == ''
        run: echo "::warning::Нет секрета UNITY_LICENSE, проверка в Unity пропущена (см. player/README.md)"
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''

      - name: Пакет планетарного редуктора из открытого STEP
        if: env.UNITY_LICENSE != ''
        run: |
          python -m pip install -q -e "studio[dev]"
          sh samples/fetch_open_samples.sh
          stark-studio process samples/open/nema17_planetary_arm.step -o samples/open/nema17_planetary.stark

      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: player/Library
          key: Library-${{ hashFiles('player/Packages/manifest.json', 'player/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-

      - name: Unity тесты (EditMode + PlayMode)
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@v4.3.2  # v4.4+ ломает активацию Personal ULF (TimeStamp validation failed), game-ci/unity-test-runner#336
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: player
          testMode: all
          artifactsPath: unity-test-results

      - name: Видео из кадров (ffmpeg)
        if: always() && env.UNITY_LICENSE != ''
        run: |
          sudo apt-get update -qq >/dev/null || true
          sudo apt-get install -y -qq ffmpeg >/dev/null || true
          cd player/TestScreenshots/video 2>/dev/null || exit 0
          sudo chown -R "$(id -u)" . || true
          for d in */; do
            name="${d%/}"
            ffmpeg -loglevel error -y -framerate 15 -i "$name/%05d.png" -c:v libx264 -pix_fmt yuv420p -vf "scale=960:-2" "../$name.mp4"
          done
          cd .. && rm -rf video && ls -la

      - uses: actions/upload-artifact@v4
        if: always() && env.UNITY_LICENSE != ''
        with:
          name: player-screenshots
          path: player/TestScreenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && env.UNITY_LICENSE != ''
        with:
          name: unity-test-results
          path: unity-test-results
          if-no-files-found: warn
