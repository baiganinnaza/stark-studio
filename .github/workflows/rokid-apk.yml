name: rokid-apk
# APK «Stark для Rokid AI Glasses»: тесты ядра, сборка, дымовая проверка на эмуляторе 480×640.
on:
  push:
    paths: ["rokid/**", "samples/**", ".github/workflows/rokid-apk.yml"]
  pull_request:
    paths: ["rokid/**", "samples/**", ".github/workflows/rokid-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.name.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты ядра и сборка APK
        working-directory: rokid
        env:
          STARK_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - id: name
        name: Имя файла
        run: |
          APK="stark-rokid-0.1.${{ github.run_number }}.apk"
          cp rokid/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: stark-rokid-apk
          path: ${{ steps.name.outputs.apk }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rokid-unit-tests
          path: rokid/app/build/reports/tests/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stark-rokid-apk
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор с экраном как у Rokid (480×640)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash rokid/ci/emulator-smoke.sh ${{ needs.build.outputs.apk }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rokid-screenshots
          path: rokid/ci/shots/
